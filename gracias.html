<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — W&amp;D Painting Houston</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F3FD1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
  :root{--putty:#EFEDE8;--ink:#14161A;--muted:#5E646A;--chalk:#F4F2ED;--cobalt:#1F3FD1;--cobalt-lift:#3C58E6;--rule:#C9C4B8;--sans:"Archivo","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--putty);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
  header{border-bottom:2px solid var(--ink)}
  .nav{max-width:1440px;margin:0 auto;padding:0 clamp(20px,5vw,84px);height:78px;display:flex;align-items:center}
  .mark{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-weight:800;font-stretch:118%;text-transform:uppercase;letter-spacing:-.01em;font-size:19px}
  .mark i{width:13px;height:13px;background:var(--cobalt);display:block}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(40px,8vw,120px) clamp(20px,5vw,84px)}
  .box{max-width:44ch}
  .lbl{font-size:11px;font-weight:700;font-stretch:112%;text-transform:uppercase;letter-spacing:.2em;color:var(--cobalt);display:block;margin-bottom:20px}
  h1{font-weight:800;font-stretch:118%;text-transform:uppercase;line-height:.9;letter-spacing:-.02em;font-size:clamp(38px,7vw,84px)}
  p{margin-top:24px;font-size:clamp(17px,1.4vw,19px);color:var(--muted);max-width:42ch}
  p b{color:var(--ink);font-weight:700}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;padding:18px 28px;text-decoration:none;border:2px solid var(--ink);border-radius:0;transition:background .2s,color .2s,border-color .2s}
  .btn-fill{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  .btn-fill:hover{background:var(--cobalt-lift);border-color:var(--cobalt-lift)}
  .btn-out:hover{background:var(--ink);color:var(--chalk)}
  :focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
</style>
</head>
<body>
<header>
  <div class="nav"><a class="mark" href="/es.html"><i aria-hidden="true"></i>W&amp;D Painting Houston</a></div>
</header>
<main>
  <div class="box">
    <span class="lbl">W&amp;D Painting Houston</span>
    <h1>Gracias — mensaje recibido.</h1>
    <p>Te contactamos pronto para coordinar tu cotización gratis. ¿Algo urgente? Llámanos al <b>(832) 806-8583</b>.</p>
    <div class="cta">
      <a class="btn btn-fill" href="tel:+18328068583">Llama (832) 806-8583</a>
      <a class="btn btn-out" href="/es.html">Volver al sitio</a>
    </div>
  </div>
</main>
</body>
</html>
